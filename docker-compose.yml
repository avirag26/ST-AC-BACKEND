services:
  postgres:
    image: postgres:16-alpine
    container_name: stac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stac
      POSTGRES_PASSWORD: stac_secret
      POSTGRES_DB: stac_db
    ports:
      - "5432:5432"
    volumes:
      - stac_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stac -d stac_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stac-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - stac_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: stac-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stac_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: stac-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/stac-uploads || true;
      mc anonymous set download local/stac-uploads || true;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stac-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://stac:stac_secret@postgres:5432/stac_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: stac-uploads
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
    ports:
      - "4000:4000"

volumes:
  stac_postgres_data:
  stac_redis_data:
  stac_minio_data:
